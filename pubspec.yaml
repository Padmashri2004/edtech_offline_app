name: edtech_offline_app
description: "Offline EdTech portal with Gemma 3 AI - RootEd"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 
  # AI & Core Persistence
  flutter_gemma: ^0.12.0
  sqflite: ^2.4.2
  path: ^1.9.1
 
  # File Management
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  logger: ^2.5.0
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  permission_handler: ^11.3.0  # ✅ ADDED for Downloads folder access
 
  # Image & Crypto
  image: ^4.1.7
  crypto: ^3.0.3
 
  # PDF Packages
  pdf: ^3.10.0
  printing: ^5.11.0
  syncfusion_flutter_pdf: ^27.1.58

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  http: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/gemma.task